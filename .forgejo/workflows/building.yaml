name: Building
on:
  push:
    tags:
      - "v*"

jobs:
  building:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: https://github.com/docker/setup-buildx-action@v4
      - id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: code.0x7r.com/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: https://github.com/docker/login-action@v4
        with:
          registry: code.0x7r.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: https://github.com/docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_AUTH_TOKEN }}
